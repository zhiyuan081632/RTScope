# 进一步的去混响配置模式，0表示使用默认值。
dr_level = 2.0

# 遗忘因子，取值范围[0, 1]，0为使用默认值。遗忘因子越大迭代越稳定，但对外界变化的跟踪速度越慢。
dr_forget = 0.999


##############################
#
# Beamforming相关参数
#

#
# Beamforming算法
# 0 (BF_ALG_BYPASS): 不做任何处理。
# 1 (BF_ALG_FIXED): 固定波束形成。
# 301 (BF_ALG_DOMINANT_PILOT): 基于外部监督信息的波束形成算法。
