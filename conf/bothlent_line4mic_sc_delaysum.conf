#
# 1号噪声类型。
# 0: 直接使用单通道噪声数据。
# 1: 直接使用多通道噪声数据（通道数为nummics）。
# 2: 随机使用多通道噪声数据，需满足：音源通道数 >= nummics。
# 21: 环状散射模型。
# 31: 柱面散射模型。
# 41, 42, 43: 球面散射模型。档位越高模拟越精确，计算量越大。
#
