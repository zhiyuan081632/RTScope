bf_algorithm = 2

# 该参数控制BF算法中滤波器的长度，0为使用默认值。环境混响越大，需要的滤波器越长，计算量越大，收敛速度越慢。
bf_power = 1

# 本参数用于平衡噪声抑制和语音失真。该参数越大则噪声抑制效果越明显，但同时语音失真也越大。
bf_level = 1.0

# 遗忘因子，取值范围[0, 1]，0为使用默认值。遗忘因子越大迭代越稳定，但对外界变化的跟踪速度越慢。
bf_forget = 0.999

